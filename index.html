<style>
/* Layout: one narrow column. Home = cards for each oshi and group (箱). An entry page =
   a lightly tinted header (icon + name, small 編集 at the corner), then a basic info panel
   laid out as rows: label | value | コピー 開く, then hashtags, other links, memory links.
   Each entry's first theme colour (--c) tints its page in small doses. */
:root {
  --bg: #f5f5f8;
  --surface: #ffffff;
  --ink: #34343e;
  --ink-2: #6e6e7c;
  --line: #e6e6ed;
  --na: #6b6f94;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-logo: "Outfit", "Zen Kaku Gothic New", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15151a; --surface: #1e1e25; --ink: #e6e5ec; --ink-2: #a5a4b3; --line: #30303a; --na: #a3a6c8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15151a; --surface: #1e1e25; --ink: #e6e5ec; --ink-2: #a5a4b3; --line: #30303a; --na: #a3a6c8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 14px; line-height: 1.65; padding-inline: 16px; padding-block: 24px 64px;
}
.wrap { max-width: 600px; margin-inline: auto; }
.page { --accent: var(--na); --ac-ink: var(--bg); display: flex; flex-direction: column; gap: 24px; }
.page.has-c { --accent: var(--c); }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* avatar */
.av { width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; overflow: hidden; flex: none; font-weight: 700; font-size: 17px; line-height: 1; }
.av.lg { width: 64px; height: 64px; font-size: 26px; }
.av .em { font-weight: 400; white-space: nowrap; }
.av .em.e1 { font-size: 22px; } .av .em.e2 { font-size: 16px; } .av .em.e3 { font-size: 12px; }
.av.lg .em.e1 { font-size: 34px; } .av.lg .em.e2 { font-size: 25px; } .av.lg .em.e3 { font-size: 19px; }

/* headings */
h1 { margin: 0; font-size: 21px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
h1.logo { font-family: var(--font-logo); font-weight: 500; font-size: 22px; letter-spacing: .16em; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.hero-card {
  display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 18px;
  background: var(--surface); border: 1px solid var(--line);
  background: color-mix(in srgb, var(--accent) 9%, var(--surface));
  border-color: color-mix(in srgb, var(--accent) 28%, var(--line));
}

    var b = /^(\d\d)-(\d\d)$/.exec(e.birthday || "");
    if (b) { var n = nextOcc(+b[1], +b[2]); out.push({ label: "誕生日", date: n, days: diffDays(n) }); }
    var p = parseYMD(e.debut);
    if (p) {
      var d0 = new Date(p[0], p[1] - 1, p[2]);
      if (d0 > today()) out.push({ label: dl + "日", date: d0, days: diffDays(d0) });
      else { var n2 = nextOcc(p[1], p[2]), yrs = n2.getFullYear() - p[0]; out.push({ label: yrs > 0 ? dl + yrs + "周年" : dl + "日", date: n2, days: diffDays(n2) }); }
    }
    return out;
  }
  function mdText(d) { return (d.getMonth() + 1) + "/" + d.getDate(); }
  function countText(n) { return n === 0 ? "今日" : "あと" + n + "日"; }
  function sinceText(e) {
    var p = parseYMD(e.debut); if (!p) return "";
    var d0 = new Date(p[0], p[1] - 1, p[2]), n = Math.round((today() - d0) / 864e5);
    return n >= 0 ? (e.type === "box" ? "結成" : "デビュー") + "から " + n.toLocaleString("ja-JP") + "日" : "";
  }
  function ymdText(s) { var p = parseYMD(s); return p ? p[0] + "." + pad(p[1]) + "." + pad(p[2]) : ""; }

  /* data access */
  function sorted(list) { return list.slice().sort(function (a, b) { return ((a.pin ? 0 : 1) - (b.pin ? 0 : 1)) || ((a.sort || 0) - (b.sort || 0)); }); }
  function entry(id) { return state.entries.filter(function (x) { return x.id === id; })[0]; }
  function thingsOf(owner, kind) {
    var l = state.things.filter(function (x) { return x.ownerId === owner && x.kind === kind; });
    if (kind === "memory") return l.sort(function (a, b) { var da = a.date || "9999", dd = b.date || "9999"; return da < dd ? -1 : da > dd ? 1 : (a.sort || 0) - (b.sort || 0); });
    return sorted(l);
  }
  function membersOf(boxId) { return sorted(state.entries.filter(function (x) { return x.type === "oshi" && x.boxId === boxId; })); }

  function graphemes(s) {

    return Array.from(s);

  function markOf(e) {

  function avatar(e, big) {

    return '<span class="av' + (big ? " lg" : "") + '" style="background:' + c + ";color:" + onColor(c) + '">' + inner + "</span>";

  /* ---------- row builders ---------- */
  function egChip(it) { return (it.pin ? '<span class="eg">固定</span>' : "") + (it.sample ? '<span class="eg">例</span>' : ""); }
  function noteHTML(it) { return it.note ? '<span class="note">' + esc(it.note) + "</span>" : ""; }

  function openBtn(url) { return '<a class="btn go" href="' + esc(safeHref(url)) + '" target="_blank" rel="noopener noreferrer">開く</a>'; }

  function thingRow(it) {
    var eg = egChip(it), note = noteHTML(it);

    return '<div class="row"><div class="main"><span class="kicker">' + esc(kick) + eg + "</span>" + title +

      '<div class="acts">' + (it.value ? copyBtn(it.value, "コピー") + openBtn(it.value) : "") + editBtn(it) + "</div></div>";
  }

  function groupFieldHTML(f, it) {

    var sug = gs.length ? '<div class="gchips gsug">' + gs.map(function (g) {

    return '<label for="f-group">グループ（なくてもOK）</label><input id="f-group" name="groupNew" type="text" maxlength="30" autocomplete="off" placeholder="例：資料、グッズ" value="' + esc(v) + '">' + sug;
  }
  function markGroupChip(v) {

  }

  function thingFormHTML(f) {
    var K = THING[f.kind], it = f.id ? state.things.filter(function (x) { return x.id === f.id; })[0] : null;
    var del = it ? '<button class="btn quiet danger grow" type="button" data-act="del-thing" data-id="' + esc(it.id) + '">' + (state.confirmDel === it.id ? "本当に削除" : "削除") + "</button>" : "";
    var dateField = f.kind === "memory" ? '<label for="f-date">日付（なくてもOK）</label><input id="f-date" name="date" type="date" value="' + esc(it && it.date) + '">' : "";
    var req = f.kind === "memory" ? "" : " required";

      dateField +

      '<label for="f-value">' + K.valueName + '</label><input id="f-value" name="value" type="text" maxlength="300" autocomplete="off"' + req + ' placeholder="' + esc(K.valuePh) + '"' + (f.kind === "link" || f.kind === "memory" ? ' inputmode="url"' : "") + ' value="' + esc(it && it.value) + '">' +
      (f.kind === "link" ? groupFieldHTML(f, it) : "") +
      (f.kind === "mark" ? "" : '<label for="f-note">メモ（なくてもOK）</label><input id="f-note" name="note" type="text" maxlength="120" autocomplete="off" value="' + esc(it && it.note) + '">') +
      '<p class="err" id="f-err" role="alert" hidden></p>' +
      '<div class="editor-acts"><button class="btn pri" type="submit">保存</button><button class="btn" type="button" data-act="cancel">キャンセル</button>' + del + "</div></form>";
  }

  function colorRow(hex) {
    return '<div class="crow"><input class="cpick" type="color" value="' + esc(hex) + '" aria-label="色を選ぶ"><input class="chex" name="colorHex" type="text" maxlength="7" autocomplete="off" spellcheck="false" value="' + esc(hex) + '" aria-label="カラーコード"><button class="btn small quiet" type="button" data-act="rm-color">消す</button></div>';
  }

  function entryFormHTML(f) {

    var del = "";
    return '<form class="editor" data-form="entry" data-etype="oshi" data-id="' + esc(f.id || "") + '">' +
      '<label for="e-name">推しの名前</label><input id="e-name" name="name" type="text" maxlength="60" autocomplete="off" required value="' + esc(data.name) + '">' +
      '<label for="e-fan">ファンネーム（呼び名）</label><input id="e-fan" name="fanName" type="text" maxlength="40" autocomplete="off" value="' + esc(data.fanName) + '">' +
      '<label for="e-mark">ファンマーク（アイコンにも使われます）</label><input id="e-mark" name="fanMark" type="text" maxlength="16" autocomplete="off" value="' + esc(e ? markOf(e) : "") + '">' +
      '<label for="e-yt">YouTube（URLか@ID）</label><input id="e-yt" name="youtube" type="text" maxlength="300" autocomplete="off" inputmode="url" value="' + esc(data.youtube) + '">' +
      '<label for="e-x">X（URLか@ID）</label><input id="e-x" name="x" type="text" maxlength="300" autocomplete="off" inputmode="url" value="' + esc(data.x) + '">' +
      '<label for="e-bd">誕生日（例：3/14）</label><input id="e-bd" name="birthday" type="text" maxlength="12" autocomplete="off" value="' + esc((data.birthday || "").replace("-", "/").replace(/^0/, "").replace(/\/0/, "/")) + '">' +
      '<label for="e-debut">デビュー日</label><input id="e-debut" name="debut" type="date" value="' + esc(data.debut) + '">' +
      '<span class="lab">テーマカラー（1つ目がページの色になります）</span><div id="color-list">' + cols.map(colorRow).join("") + '</div>' +
      '<div><button class="btn small" type="button" data-act="add-color">＋色を追加</button></div>' +
      '<label for="e-memo">ひとこと</label><textarea id="e-memo" name="memo" maxlength="200">' + esc(data.memo) + "</textarea>" +
      '<p class="err" id="f-err" role="alert" hidden></p>' +
      '<div class="editor-acts"><button class="btn pri" type="submit">保存</button><button class="btn" type="button" data-act="cancel">キャンセル</button>' + del + "</div></form>";
  }

  /* ---------- pages ---------- */
  function cardHTML(e) {
    return '<button class="card" type="button" data-act="open" data-id="' + esc(e.id) + '" style="' + cvar(e) + '">' + avatar(e) +
      '<span class="ct"><span class="cn">' + esc(e.name) + "</span>" + (e.pin ? '<span class="cs">固定中</span>' : "") + "</span></button>";
  }

  function noteBanner() {
    var n = state.entries.filter(function (x) { return x.sample; }).length + state.things.filter(function (x) { return x.sample; }).length;
    return n ? '<div class="sample-note"><p>「例」と書いてあるものはサンプルです。使い方を見たら消してね。</p><button class="btn small' + (state.confirmClear ? " pri" : "") + '" type="button" data-act="clear-samples">' + (state.confirmClear ? "本当に消す" : "例をすべて消す") + "</button></div>" : "";
  }

  function listFor(scope, owner) { return scope === "home" ? sorted(state.entries) : thingsOf(owner, scope); }
  function updFor(scope, id, patch) { return scope === "home" ? store.updateEntry(id, patch) : store.updateThing(id, patch); }
  function moveItem(id, dir, scope, owner) {
    var list = scopeList(scope, owner, id), i = list.map(function (x) { return x.id; }).indexOf(id), j = i + dir;
    if (i < 0 || j < 0 || j >= list.length || !!list[i].pin !== !!list[j].pin) return;
    var a = list[i], b = list[j], sa = a.sort || 0, sb = b.sort || 0;
    var p = sa === sb ? updFor(scope, a.id, { sort: sa + (dir > 0 ? 0.5 : -0.5) })
      : updFor(scope, a.id, { sort: sb }).then(function () { return updFor(scope, b.id, { sort: sa }); });
    p.then(null, function () { toast("並べ替えできませんでした"); });
  }
  function togglePin(id, scope, owner) {
    var list = scopeList(scope, owner, id), it = list.filter(function (x) { return x.id === id; })[0]; if (!it) return;
    var patch = { pin: !it.pin };
    if (!it.pin) patch.sort = Math.min.apply(null, list.map(function (x) { return x.sort || 0; })) - 1;
    updFor(scope, id, patch).then(null, function () { toast("固定できませんでした"); });
  }
  function reorderRow(it, scope, owner, i, list) {
    var attrs = ' data-id="' + esc(it.id) + '" data-scope="' + scope + '" data-owner="' + esc(owner || "") + '"';
    var body;
    if (scope === "home") body = avatar(it) + '<div class="main"><span class="title">' + esc(it.name) + "</span></div>";
    else if (scope === "tag") body = '<div class="main"><span class="kicker">' + esc(it.label) + '</span><span class="tag">' + esc(it.value) + "</span></div>";
    else body = '<div class="main"><span class="kicker">' + esc(platOf(it.value)) + '</span><span class="title">' + esc(it.label) + "</span></div>";
    return '<li class="dr" data-dkind="item" data-dscope="' + scope + '" data-downer="' + esc(owner || "") + '" data-did="' + esc(it.id) + '" data-dgroup="' + esc(scope === "link" ? (it.group || "") : "") + '" data-dpin="' + (it.pin ? 1 : 0) + '">' +
      '<div class="row"><span class="grip" aria-hidden="true">⋮⋮</span>' + body + '<div class="acts"><button class="btn small' + (it.pin ? " on" : "") + '" type="button" data-act="pin"' + attrs + ">" + (it.pin ? "固定中" : "固定") + "</button>" +
      (scope === "home" ? '<button class="btn small quiet danger" type="button" data-act="del-entry" data-id="' + esc(it.id) + '">削除</button>' : "") + "</div></div></li>";
  }

  function helpHTML() {
    return '<details class="help"><summary>使い方</summary><ul>' +
      '<li><b>追加</b>：「＋追加」で推しを登録。推しのページでは、ハッシュタグ・リンク・思い出を足せます。</li>' +
      '<li><b>グループ</b>：リンクには「グループ」を付けられます（引用元など）。検索は上の欄から。</li>' +
      '<li><b>並べ替え</b>：「並べ替え」を押して、行を長押ししたままドラッグ。「固定」で上に留められます。</li>' +
      '<li><b>削除</b>：推しは、一覧の「並べ替え」の中の「削除」から（2回押すと消えます）。リンクなどは各行の編集から。</li>' +
      '<li><b>共有</b>：推しのページの「この推しを共有用にコピー」でコードをコピー。相手は一覧の「読み込む」に貼り付けると同じデータが入ります。コードは先頭の「LL1」から最後まで全部貼ってください。</li>' +
      '<li><b>文字でコピー</b>：メモアプリなどに貼れる読みやすい文字でコピーします（読み込み用ではありません）。</li>' +
      '<li><b>更新</b>：画面を下に引っ張ると読み込み直せます。</li></ul></details>';
  }

  function homeHTML() {
    var f = state.form, oshis = sorted(state.entries), ro = !!(state.reorder && state.reorder.scope === "home");
    var form = f && f.type === "entry" && !f.id ? entryFormHTML(f) : "";
    var sortBtn = oshis.length > 1 ? (ro ? '<button class="btn small" type="button" data-act="reorder-off">完了</button>' : '<button class="btn small quiet" type="button" data-act="reorder-on" data-scope="home">並べ替え</button>') : "";
    var body;
    if (!oshis.length) body = '<ul class="list"><li class="empty">' + (state.loaded ? "まだ推しがいません。＋追加から入れてね。" : "読み込み中…") + "</li></ul>";
    else if (ro) body = '<ul class="list">' + oshis.map(function (x, i) { return reorderRow(x, "home", "", i, oshis); }).join("") + "</ul>";
    else body = '<div class="cards">' + oshis.map(cardHTML).join("") + "</div>";
    return '<div class="page"><header><h1 class="logo">LINK LIST</h1></header>' + form + noteBanner() +
      '<section><div class="sec-head"><h2>推し</h2><div class="sec-acts">' + sortBtn + (ro ? "" : '<button class="btn small" type="button" data-act="add-entry" data-etype="oshi">＋追加</button>') + "</div></div>" + (ro ? '<p class="hint">行を長押しして、動かしたい場所までドラッグします。削除は右のボタンから（2回押すと消えます）。</p>' : "") + body + "</section>" +
      xferHomeHTML() + helpHTML() + '<p class="foot">LINK LIST v' + APP_VERSION + (store ? " ・ " + (store.kind === "db" ? "変更は自動で保存されます。" : "変更はこのブラウザにだけ保存されます。") : "") + "</p></div>";
  }

  function groupOrderOf(e, all) {
    var names = [], seen = {};
    all.forEach(function (it) { if (it.group && !seen[it.group]) { seen[it.group] = 1; names.push(it.group); } });
    var pref = (e.groupOrder || []).filter(function (g) { return seen[g]; });
    return pref.concat(names.filter(function (g) { return pref.indexOf(g) < 0; }));
  }
  function groupsOf(owner) { var e = entry(owner); return e ? groupOrderOf(e, thingsOf(owner, "link")) : []; }
  function scopeList(scope, owner, id) {
    var list = listFor(scope, owner);
    if (scope !== "link") return list;
    var it = list.filter(function (x) { return x.id === id; })[0], g = it ? (it.group || "") : "";
    return list.filter(function (x) { return (x.group || "") === g; });
  }
  function moveGroup(owner, g, dir) {
    var e = entry(owner); if (!e) return;
    var order = groupOrderOf(e, thingsOf(owner, "link")), i = order.indexOf(g), j = i + dir;
    if (i < 0 || j < 0 || j >= order.length) return;
    var t = order[i]; order[i] = order[j]; order[j] = t;
    store.updateEntry(owner, { groupOrder: order }).then(null, function () { toast("並べ替えできませんでした"); });
  }
  function linkReorderHTML(e, all) {
    var order = groupOrderOf(e, all), out = [];
    function items(g) { return all.filter(function (it) { return (it.group || "") === g; }); }
    if (!order.length) return items("").map(function (it, i, l) { return reorderRow(it, "link", e.id, i, l); }).join("");
    order.forEach(function (g) {
      var list = items(g);
      out.push('<li class="gblock dr" data-dkind="group" data-dkey="' + esc(g) + '" data-downer="' + esc(e.id) + '"><div class="ghead"><div class="ghr"><span class="grip" aria-hidden="true">⋮⋮</span><span class="gname">' + esc(g) + '</span><span class="gcount">' + list.length + '</span></div></div><ul class="inner">' +
        list.map(function (it, i) { return reorderRow(it, "link", e.id, i, list); }).join("") + "</ul></li>");
    });
    var un = items("");
    if (un.length) out.push('<li class="gblock"><div class="ghead"><div class="ghr"><span class="gname">未分類</span><span class="gcount">' + un.length + '</span></div></div><ul class="inner">' +
      un.map(function (it, i) { return reorderRow(it, "link", e.id, i, un); }).join("") + "</ul></li>");
    return out.join("");
  }
  function linkLisHTML(e) {
    var f = state.form, all = thingsOf(e.id, "link"), q = state.q.trim().toLowerCase(), lis = [];
    if (f && f.type === "thing" && f.kind === "link" && !f.id && f.ownerId === e.id) lis.push("<li>" + thingFormHTML(f) + "</li>");
    var items = q ? all.filter(function (it) { return (it.label + " " + it.value + " " + (it.note || "") + " " + (it.group || "")).toLowerCase().indexOf(q) >= 0; }) : all;
    function rowLi(it) { return "<li>" + (f && f.type === "thing" && f.id === it.id ? thingFormHTML(f) : thingRow(it)) + "</li>"; }
    if (!all.some(function (it) { return it.group; })) {
      items.forEach(function (it) { lis.push(rowLi(it)); });
    } else {
      var map = {};
      items.forEach(function (it) { var g = it.group || ""; (map[g] = map[g] || []).push(it); });
      var order = groupOrderOf(e, items).filter(function (g) { return map[g]; });
      if (map[""]) order.push("");
      order.forEach(function (g) {
        var key = e.id + "|" + g, list = map[g];
        var col = q ? false : (key in state.collapsed ? state.collapsed[key] : all.length > 8);
        if (f && f.type === "thing" && f.id && list.some(function (x) { return x.id === f.id; })) col = false;
        lis.push('<li class="ghead gflex"><button class="gbtn" type="button" data-act="toggle-group" data-key="' + esc(key) + '" aria-expanded="' + (col ? "false" : "true") + '"><span class="chev">' + (col ? "▸" : "▾") + '</span><span class="gname">' + esc(g || "未分類") + '</span><span class="gcount">' + list.length + '</span></button><button class="gadd" type="button" data-act="add-thing" data-kind="link" data-owner="' + esc(e.id) + '" data-group="' + esc(g) + '" aria-label="このグループに追加">＋</button></li>');
        if (!col) list.forEach(function (it) { lis.push(rowLi(it)); });
      });
    }
    if (!items.length) lis.push('<li class="empty">' + (q ? "見つかりませんでした。" : THING.link.empty) + "</li>");
    return lis.join("");
  }

  function sectionHTML(e, kind) {
    var K = THING[kind], f = state.form, lis = [], all = thingsOf(e.id, kind);
    var ro = !!(state.reorder && state.reorder.scope === kind && state.reorder.owner === e.id);
    var canSort = kind !== "memory" && all.length > 1;
    if (ro && kind === "link") {
      lis.push(linkReorderHTML(e, all));
    } else if (ro) {
      all.forEach(function (it, i) { lis.push(reorderRow(it, kind, e.id, i, all)); });
    } else if (kind === "link") {
      lis.push(linkLisHTML(e));
    } else {
      if (f && f.type === "thing" && f.kind === kind && !f.id && f.ownerId === e.id) lis.push("<li>" + thingFormHTML(f) + "</li>");
      all.forEach(function (it) { lis.push("<li>" + (f && f.type === "thing" && f.id === it.id ? thingFormHTML(f) : thingRow(it)) + "</li>"); });

  function parseMsg(err) {
    var c = err && err.message, n = err && err.n;
    if (c === "format") return "コードが見つかりませんでした。「LL1z:」で始まる文字列を貼り付けてね。（貼り付けた文字数：" + n + "）";
    if (c === "cut") return "コードが途中で切れているか、文字が変わっているみたいです。もう一度コピーして貼ってね。（読み取れたコード部分：" + n + "文字）";
    if (c === "nocomp") return "このブラウザでは、この形式のコードを読み込めません。";
    if (c === "json" || c === "shape") return "コードの中身を読み取れませんでした。LINK LISTで作ったコードか確認してね。";
    return "読み込めませんでした。";
  }
  function xferPanel() {
    var x = state.xfer; if (!x) return "";
    if (x.mode === "import") {
      var pv = "";
      if (x.parsed) {
        var n = x.parsed.length, th = x.parsed.reduce(function (a, e) { return a + e.things.length; }, 0);
        var names = x.parsed.slice(0, 4).map(function (e) { return e.name; }).join("、") + (n > 4 ? " ほか" : "");
        pv = '<p class="xmsg">' + esc(names) + "（" + n + "人、リンクやタグなど" + th + "件）を追加します。今あるデータは変わりません。</p>";
      }
      return '<div class="editor xfer"><label for="imp-text">もらったコードを貼り付け</label><textarea id="imp-text" rows="4" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" placeholder="LL1z:…">' + esc(x.text || "") + "</textarea>" +
        '<p class="hint" id="imp-count">貼り付けた文字数：' + String(x.text || "").trim().length + "</p>" +
        (x.msg ? '<p class="err" role="alert">' + esc(x.msg) + "</p>" : "") + pv +
        '<div class="editor-acts">' + (x.parsed ? '<button class="btn pri" type="button" data-act="xfer-run">追加する</button>' : '<button class="btn pri" type="button" data-act="xfer-parse">内容を確認</button>') +
        '<button class="btn" type="button" data-act="xfer-close">閉じる</button></div></div>';
    }
    return '<div class="editor xfer"><label for="exp-text">' + (x.busy ? "作成中…" : "共有用のコード（" + (x.code || "").length + "文字）") + '</label><textarea id="exp-text" rows="4" readonly spellcheck="false">' + esc(x.code || "") + "</textarea>" +
      '<p class="hint">相手のLINK LISTの「読み込む」に貼り付けると、同じ内容が相手のデータに追加されます。コピーできないときは、枠の中を長押しして、すべて選択してからコピーしてね。</p>' +
      '<div class="editor-acts"><button class="btn pri" type="button" data-act="xfer-copy"' + (x.code ? "" : " disabled") + '>コピー</button><button class="btn" type="button" data-act="xfer-close">閉じる</button></div></div>';
  }
  function xferEntryHTML(e) {
    var x = state.xfer, open = x && x.mode === "export" && x.id === e.id;
    return '<section><div class="sec-head"><h2>共有</h2></div>' + (open ? xferPanel() :
      '<div class="xrow"><button class="btn small" type="button" data-act="xfer-export" data-id="' + esc(e.id) + '">この推しを共有用にコピー</button><button class="btn small quiet" type="button" data-act="text-export" data-id="' + esc(e.id) + '">文字でコピー</button></div>') + "</section>";
  }
  function xferHomeHTML() {
    var x = state.xfer;
    if (x && (x.mode === "import" || (x.mode === "export" && x.all))) return "<section>" + xferPanel() + "</section>";
    return '<div class="xrow"><button class="btn small quiet" type="button" data-act="xfer-import">読み込む</button>' + (state.entries.length ? '<button class="btn small quiet" type="button" data-act="xfer-export-all">全部を書き出す</button><button class="btn small quiet" type="button" data-act="text-export-all">全部を文字でコピー</button>' : "") + "</div>";
  }
  async function startExport(ids, all, id) {
    state.xfer = { mode: "export", id: id || "", all: !!all, code: "", busy: true }; render();
    var x = state.xfer;
    try { x.code = await packData(buildExport(ids)); } catch (e) { x.code = ""; toast("コードを作れませんでした"); }
    x.busy = false; if (state.xfer === x) render();
  }

  /* ---------- drag to reorder (long press on touch, drag on mouse) ---------- */
  var press = null;
  function sameKind(a, b) { return b.dataset.dkind === a.dataset.dkind && b.dataset.dgroup === a.dataset.dgroup && b.dataset.dpin === a.dataset.dpin; }
  function cand(el, dir) {
    var sib = dir < 0 ? el.previousElementSibling : el.nextElementSibling;
    return sib && sameKind(el, sib) ? sib : null;
  }
  function dragOrder(el) {
    var d = el.dataset;
    return Array.prototype.filter.call(el.parentElement.children, function (c) { return sameKind(el, c); })
      .map(function (c) { return d.dkind === "group" ? c.dataset.dkey : c.dataset.did; });
  }
  function dragShift(dr, sib, before) {
    var el = dr.el, visual = el.getBoundingClientRect().top;
    el.style.transform = "";
    sib.parentElement.insertBefore(el, before ? sib : sib.nextSibling);
    var d2 = visual - el.getBoundingClientRect().top;
    dr.startY = dr.curY - d2 + (window.scrollY - dr.startScroll);
    el.style.transform = "translateY(" + d2 + "px)";
  }
  function applyDrag() {
    var dr = state.drag; if (!dr) return;
    var el = dr.el;
    el.style.transform = "translateY(" + (dr.curY - dr.startY + (window.scrollY - dr.startScroll)) + "px)";
    for (var n = 0; n < 4; n++) {
      var r = el.getBoundingClientRect(), c = r.top + r.height / 2, moved = false;
      var prev = cand(el, -1), next = cand(el, 1);
      if (prev) { var pr = prev.getBoundingClientRect(); if (c < pr.top + pr.height / 2) { dragShift(dr, prev, true); moved = true; } }
      if (!moved && next) { var nr = next.getBoundingClientRect(); if (c > nr.top + nr.height / 2) { dragShift(dr, next, false); moved = true; } }
      if (!moved) break;
    }
  }
  function dragTick() {
    var dr = state.drag; if (!dr) return;
    var y = dr.curY, h = window.innerHeight, v = 0;
    if (y < 90) v = -Math.ceil((90 - y) / 8); else if (y > h - 90) v = Math.ceil((y - (h - 90)) / 8);
    if (v) window.scrollBy(0, v);
    applyDrag();
    dr.raf = requestAnimationFrame(dragTick);
  }
  function beginDrag() {
    var p = press; if (!p || p.dragging) return;
    p.dragging = true;
    state.drag = { el: p.el, before: dragOrder(p.el), startY: p.y, curY: p.y, startScroll: window.scrollY, raf: 0 };
    p.el.classList.add("dragging");
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
    dragTick();
  }
  function doneWrite() { state.writing--; if (!state.writing) render(); }
  function commitItems(scope, owner, ids) {
    var list = listFor(scope, owner), byId = {};
    list.forEach(function (x) { byId[x.id] = x; });
    var vals = ids.map(function (id) { return (byId[id] && byId[id].sort) || 0; }).sort(function (a, b) { return a - b; });
    for (var i = 1; i < vals.length; i++) if (vals[i] <= vals[i - 1]) vals[i] = vals[i - 1] + 0.001;
    var upd = [];
    ids.forEach(function (id, i) { if (byId[id] && (byId[id].sort || 0) !== vals[i]) upd.push([id, vals[i]]); });
    if (!upd.length) return;
    state.writing++;
    Promise.all(upd.map(function (u) { return updFor(scope, u[0], { sort: u[1] }); }))
      .then(null, function () { toast("並べ替えできませんでした"); }).then(doneWrite);
  }
  function endDrag() {
    var dr = state.drag; if (!dr) return;
    cancelAnimationFrame(dr.raf);
    var el = dr.el, d = el.dataset;
    el.style.transform = ""; el.classList.remove("dragging");
    state.drag = null;
    var after = dragOrder(el);
    if (after.join("\u0001") === dr.before.join("\u0001")) { if (state.dirty) render(); return; }
    if (d.dkind === "group") {
      state.writing++;
      store.updateEntry(d.downer, { groupOrder: after }).then(null, function () { toast("並べ替えできませんでした"); }).then(doneWrite);
    } else commitItems(d.dscope, d.downer, after);
  }
  function pressTarget(t) {
    if (!state.reorder || !t.closest || t.closest("button, a, input, select, textarea")) return null;
    return t.closest(".dr");
  }
  function endPress() {
    if (!press) return;
    clearTimeout(press.timer);
    var was = press.dragging; press = null;
    if (was) endDrag();
  }
  document.addEventListener("touchstart", function (e) {
    var el = pressTarget(e.target); if (!el || e.touches.length !== 1) return;
    var t = e.touches[0];
    press = { el: el, x: t.clientX, y: t.clientY, touch: true, dragging: false, timer: setTimeout(beginDrag, 320) };
  }, { passive: true });
  document.addEventListener("touchmove", function (e) {
    if (!press) return;
    var t = e.touches[0];
    if (press.dragging) { e.preventDefault(); state.drag.curY = t.clientY; return; }
    if (Math.abs(t.clientY - press.y) > 8 || Math.abs(t.clientX - press.x) > 8) { clearTimeout(press.timer); press = null; }
  }, { passive: false });
  document.addEventListener("touchend", endPress, { passive: true });
  document.addEventListener("touchcancel", endPress, { passive: true });
  document.addEventListener("mousedown", function (e) {
    if (e.button !== 0) return;
    var el = pressTarget(e.target); if (!el) return;
    press = { el: el, x: e.clientX, y: e.clientY, touch: false, dragging: false, timer: 0 };
  });
  document.addEventListener("mousemove", function (e) {
    if (!press || press.touch) return;
    if (press.dragging) { state.drag.curY = e.clientY; return; }
    if (Math.abs(e.clientY - press.y) > 4) beginDrag();
  });
  document.addEventListener("mouseup", function () { if (press && !press.touch) endPress(); });
  document.addEventListener("contextmenu", function (e) { if (state.reorder && e.target.closest && e.target.closest(".dr")) e.preventDefault(); });

  /* ---------- pull to refresh ---------- */
  var ptrEl = document.createElement("div");
  ptrEl.className = "ptr"; ptrEl.setAttribute("aria-hidden", "true"); ptrEl.innerHTML = "<i></i>";
  document.body.appendChild(ptrEl);
  var ptr = { y: 0, d: 0, on: false, busy: false };
  function setPtr(d, anim) {
    ptrEl.style.transition = anim ? "transform .2s ease, opacity .2s ease" : "none";
    ptrEl.style.transform = "translateY(" + (d - 48) + "px)";
    ptrEl.style.opacity = d > 0 ? Math.min(1, d / 56) : 0;
    ptrEl.firstChild.style.transform = "rotate(" + (d * 5) + "deg)";
  }
  function refreshNow() {
    ptr.busy = true; ptrEl.classList.add("spin"); setPtr(56, true);
    setTimeout(function () {
      render(); ptrEl.classList.remove("spin"); setPtr(0, true); ptr.busy = false; toast("更新しました");
    }, 700);
  }
  document.addEventListener("touchstart", function (e) {
    if (ptr.busy || state.reorder || window.scrollY > 0 || inEditor() || e.touches.length !== 1) { ptr.on = false; return; }
    ptr.y = e.touches[0].clientY; ptr.d = 0; ptr.on = true;
  }, { passive: true });
  document.addEventListener("touchmove", function (e) {
    if (!ptr.on) return;
    var d = e.touches[0].clientY - ptr.y;
    if (d <= 0 || window.scrollY > 0) { ptr.d = 0; setPtr(0); return; }
    ptr.d = Math.min(d * 0.5, 80); setPtr(ptr.d);
  }, { passive: true });
  document.addEventListener("touchend", function () {
    if (!ptr.on) return;
    ptr.on = false;
    if (ptr.d >= 56) refreshNow(); else setPtr(0, true);
  }, { passive: true });

  /* ---------- start ---------- */
  render();
  (async function () {
    var db = null;
    try { db = (await (window.claude && window.claude.use ? window.claude.use("db") : null)) || null; } catch (e) { db = null; }
    store = db ? makeDbStore(db) : makeLocalStore();
    store.init(onData);
  })();
})();
</script>

</body></html>

<style>
/* Layout: one narrow column. Home = cards for each oshi and group (箱). An entry page =
   a lightly tinted header (icon + name, small 編集 at the corner), then a basic info panel
   laid out as rows: label | value | コピー 開く, then hashtags, other links, memory links.
   Each entry's first theme colour (--c) tints its page in small doses. */
:root {
  --bg: #f5f5f8;
  --surface: #ffffff;
  --ink: #34343e;
  --ink-2: #6e6e7c;
  --line: #e6e6ed;
  --na: #6b6f94;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-logo: "Outfit", "Zen Kaku Gothic New", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15151a; --surface: #1e1e25; --ink: #e6e5ec; --ink-2: #a5a4b3; --line: #30303a; --na: #a3a6c8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15151a; --surface: #1e1e25; --ink: #e6e5ec; --ink-2: #a5a4b3; --line: #30303a; --na: #a3a6c8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 14px; line-height: 1.65; padding-inline: 16px; padding-block: 24px 64px;
}
.wrap { max-width: 600px; margin-inline: auto; }
.page { --accent: var(--na); --ac-ink: var(--bg); display: flex; flex-direction: column; gap: 24px; }
.page.has-c { --accent: var(--c); }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* avatar */
.av { width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; overflow: hidden; flex: none; font-weight: 700; font-size: 17px; line-height: 1; }
.av.lg { width: 64px; height: 64px; font-size: 26px; }
.av .em { font-weight: 400; white-space: nowrap; }
.av .em.e1 { font-size: 22px; } .av .em.e2 { font-size: 16px; } .av .em.e3 { font-size: 12px; }
.av.lg .em.e1 { font-size: 34px; } .av.lg .em.e2 { font-size: 25px; } .av.lg .em.e3 { font-size: 19px; }

/* headings */
h1 { margin: 0; font-size: 21px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
h1.logo { font-family: var(--font-logo); font-weight: 500; font-size: 22px; letter-spacing: .16em; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.hero-card {
  display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 18px;
  background: var(--surface); border: 1px solid var(--line);
  background: color-mix(in srgb, var(--accent) 9%, var(--surface));
  border-color: color-mix(in srgb, var(--accent) 28%, var(--line));
}

  function listFor(scope, owner) { return scope === "home" ? sorted(state.entries) : thingsOf(owner, scope); }

    if (i < 0 || j < 0 || j >= list.length || !!list[i].pin !== !!list[j].pin) return;

  function focusForm() { var el = document.querySelector(".editor input[type=text], .editor textarea"); if (el) el.focus(); }

  /* ---------- events ---------- */
  function removeMany(list, fn) { return list.reduce(function (p, x) { return p.then(function () { return fn(x.id); }); }, Promise.resolve()); }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var act = b.getAttribute("data-act"), id = b.getAttribute("data-id"), kind = b.getAttribute("data-kind");
    if (act === "copy") { copyText(b.getAttribute("data-text")); return; }

    if (act === "reorder-off") { state.reorder = null; render(); return; }

    if (act === "pin") { togglePin(id, b.getAttribute("data-scope"), b.getAttribute("data-owner") || ""); return; }

      var list = document.getElementById("color-list");

    if (!label || (!value && kind !== "memory")) { fail("名前と内容を入力してね。"); return; }

    }
    if (kind === "tag") { value = "#" + value.replace(/\s+/g, "").replace(/^[#＃]+/, ""); if (value === "#") { fail("タグの文字を入れてね。"); return; } }
    var td = { ownerId: owner, kind: kind, label: label, value: value, note: note, date: kind === "memory" ? date : "" };
    state.form = null;
    var op;
    if (id) { td.sample = false; op = store.updateThing(id, td); } else { td.sort = Date.now(); op = store.addThing(td); }
    op.then(function () { toast("保存しました"); }, function () { toast("保存できませんでした"); });
    render();
  });

  document.addEventListener("focusout", function () { setTimeout(function () { if (state.dirty && !inEditor() && !state.form) render(); }, 0); });

  /* ---------- start ---------- */
  render();
  (async function () {
    var db = null;
    try { db = (await (window.claude && window.claude.use ? window.claude.use("db") : null)) || null; } catch (e) { db = null; }
    store = db ? makeDbStore(db) : makeLocalStore();
    store.init(onData);
  })();
})();
</script>

</body></html>
